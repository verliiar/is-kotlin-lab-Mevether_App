spring:
  application:
    name: Mevether
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mevether}
    username: ${DB_USERNAME:mevether}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:16}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 2MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
mevether:
  jwt:
    secret: ${JWT_SECRET}
    lifetime: ${JWT_LIFETIME:PT1H}
  sync:
    max-conflict-variants: ${MAX_CONFLICT_VARIANTS:5}
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    ru.zhuravkova.mevether: ${APP_LOG_LEVEL:INFO}
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.hibernate.orm.jdbc.error: OFF
