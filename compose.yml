services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mevether
      POSTGRES_USER: ${DB_USERNAME:-mevether}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mevether
      DB_USERNAME: ${DB_USERNAME:-mevether}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 bytes}
      JWT_LIFETIME: ${JWT_LIFETIME:-PT1H}
      MAX_CONFLICT_VARIANTS: ${MAX_CONFLICT_VARIANTS:-5}
      SERVER_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
